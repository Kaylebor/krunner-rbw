[package]
name = "krunner-rbw"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "time", "sync", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
